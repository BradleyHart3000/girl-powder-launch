<style>
/* Layout: one 9:16 stage fitted to the window; WebGL fills it edge to edge.
   Deliberately single-theme: a blush product render looks the same on any host. */
:root {
  --frame: #e6c3c8;
  --ink: #48303a;
  --ink-soft: #7d5a66;
  --rose: #c8868f;
  --rose-deep: #a35e6c;
  --tick-fg: #fff8f4;
  --glass-top: rgba(255, 250, 250, 0.58);
  --glass-bottom: rgba(255, 238, 241, 0.40);
  --glass-line: rgba(255, 255, 255, 0.78);
  --font-script: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
  --font-body: 'Jost', 'Futura', 'Avenir Next', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--frame);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
.wrap { height: 100%; display: grid; place-items: center; overflow: hidden; }
.stage {
  position: relative;
  width: 360px;
  height: 640px;
  overflow: hidden;
  container-type: size;
  background: linear-gradient(180deg, #fbe8e6 0%, #f6d8da 55%, #efc6ca 100%);
  cursor: pointer;
}
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.handle {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 13cqh;
  text-align: center;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 6.2cqw;
  letter-spacing: 0.16em;
  color: var(--rose-deep);
  pointer-events: none;
  text-shadow: 0 0.3cqw 2cqw rgba(255, 245, 245, 0.7);
}

</style>

<div class="wrap" id="wrap">
  <div class="stage" id="stage" title="Click or press space to pause">
    <canvas id="scene" aria-label="Animated 3D shopfront of the Girl Powder launch pop-up in Soho"></canvas>
    <div class="handle">itsgirlpowder</div>
  </div>
</div>

<script>
/* Fit the 9:16 stage to the window (exactly 1080×1920 when the window is that size). */
(function () {
  var wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
  function fit() {
    var W = wrap.clientWidth, H = wrap.clientHeight;
    var h = Math.min(H, W * 16 / 9), w = h * 9 / 16;
    stage.style.width = Math.floor(w) + 'px';
    stage.style.height = Math.floor(h) + 'px';
    window.dispatchEvent(new Event('stagefit'));
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const T = 20, TAU = Math.PI * 2;
const stage = document.getElementById('stage');
const canvas = document.getElementById('scene');

/* ---------- maths ---------- */
let seed = 20260703;
const rng = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sstep = (a, b, v) => { const k = clamp01((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;
const frac = v => v - Math.floor(v);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
function buildFactor(t, d) {
  const kin = clamp01((t - d) / 0.4);
  const kout = clamp01((t - (T - 0.7 + d * 0.45)) / 0.3);
  let s = kin > 0 ? backOut(kin) : 0;
  s *= 1 - easeIn(kout);
  const dy = -(1 - easeOut(kin)) * 1.6 - easeIn(kout) * 0.8;
  return [Math.max(0, s), dy];
}

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 9 / 16, 1, 200);

{ /* soft vertical gradient behind the diorama */
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#ffe2e0'); gr.addColorStop(0.55, '#fbd0d5'); gr.addColorStop(1, '#f4b9c2');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xfff4f1, 0xe7c0c6, 1.45);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0e6, 2.7);
key.position.set(-8, 15, 10);
key.target.position.set(0, 2, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -11, right: 11, top: 13, bottom: -8, near: 2, far: 50 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.025;
scene.add(key, key.target);

/* ---------- palette, caches, helpers ---------- */
const P = {
  blush: 0xf3cfd2, blushDeep: 0xe2a9b1, gravel: 0xe9bcbd,
  rose: 0xc8868f, roseLight: 0xdba4ac, roseDeep: 0x9f5a68, roseDark: 0x7a4351,
  peach: 0xf2bea4, brickA: 0xe1a28a, brickB: 0xd8927c, brickC: 0xebb39b, mortar: 0xf3dccd,
  cream: 0xfbf1e6, creamWarm: 0xf3e0cc, line: 0x1b171c, silver: 0xe4e8ee,
  neon: 0xff4d98, interior: 0xf5dada, charcoal: 0x3a3236, foliage: 0xd3909b, foliage2: 0xe4a7a7
};
const geoCache = new Map(), matCache = new Map();
function rb(w, h, d, r = 0.05) {
  const k = [w, h, d, r].join('|');
  if (geoCache.has(k)) return geoCache.get(k);
  const rr = Math.min(r, Math.min(w, h, d) / 2 - 0.002);
  const g = rr > 0.004 ? new RoundedBoxGeometry(w, h, d, 2, rr) : new THREE.BoxGeometry(w, h, d);
  geoCache.set(k, g);
  return g;
}
function mat(hex, o = {}) {
  const k = hex + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.82, metalness: 0 }, o)));
  return matCache.get(k);
}
function add(parent, geo, material, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(parent, w, h, d, c, x, y, z, r = 0.05, cast = true) {
  return add(parent, rb(w, h, d, r), typeof c === 'number' ? mat(c) : c, x, y, z, cast);
}
const lineMat = mat(P.line, { roughness: 0.45 });

const world = new THREE.Group();
scene.add(world);
const pieces = [];
function piece(d, ox = 0, oz = 0) {
  const outer = new THREE.Group(); outer.position.set(ox, 0, oz);
  const inner = new THREE.Group(); inner.position.set(-ox, 0, -oz);
  outer.add(inner); world.add(outer);
  pieces.push({ g: outer, d });
  return inner;
}
const hideForAO = [];

/* ---------- floating island and pavement ---------- */
const IRX = 7.7, IRZ = 6.0, ICZ = 0.2;
const inIsland = (x, z, inset) => Math.pow(x / (IRX - inset), 2) + Math.pow((z - ICZ) / (IRZ - inset), 2) < 1;
{
  const g = piece(0.0, 0, ICZ);
  const top = add(g, new THREE.CylinderGeometry(1, 1, 0.7, 72), mat(P.blush), 0, -0.35, ICZ);
  top.scale.set(IRX, 1, IRZ);
  const band = add(g, new THREE.CylinderGeometry(1, 0.97, 0.45, 72), mat(P.blushDeep), 0, -0.92, ICZ);
  band.scale.set(IRX, 1, IRZ);
  const rim = add(g, new THREE.TorusGeometry(1, 0.016, 8, 96), mat(P.cream), 0, 0.0, ICZ);
  rim.rotation.x = Math.PI / 2; rim.scale.set(IRX - 0.04, IRZ - 0.04, 6);
  /* low-poly rock underneath */
  const rockGeo = new THREE.ConeGeometry(1, 5.2, 14, 5);
  const pos = rockGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y < 2.59 && y > -2.59) { const j = 1 + (rng() - 0.5) * 0.22; pos.setX(i, pos.getX(i) * j); pos.setZ(i, pos.getZ(i) * j); pos.setY(i, y + (rng() - 0.5) * 0.25); }
  }
  rockGeo.computeVertexNormals();
  const rock = add(g, rockGeo, mat(0xe8b3a8, { flatShading: true }), 0, -3.75, ICZ);
  rock.rotation.x = Math.PI; rock.scale.set(IRX * 0.9, 1, IRZ * 0.9);
  const rock2 = add(g, rockGeo, mat(0xd99c97, { flatShading: true }), 0.6, -5.6, ICZ - 0.3);
  rock2.rotation.x = Math.PI; rock2.scale.set(IRX * 0.42, 0.7, IRZ * 0.42);
}
{
  const g = piece(0.08, 0, 2);
  const cob = rb(0.4, 0.1, 0.32, 0.045);
  const spots = [];
  let r = 0;
  for (let z = 0.25; z < 6.3; z += 0.37, r++) {
    for (let x = -7.4 + (r % 2 ? 0.22 : 0); x < 7.45; x += 0.44) {
      if (!inIsland(x, z, 0.4)) continue;
      if (z < 0.98 && (x > 3.15 || x < -3.15)) continue;
      spots.push([x, z]);
    }
  }
  const im = new THREE.InstancedMesh(cob, mat(0xffffff, { roughness: 0.9 }), spots.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  const shades = [0xf0c8c6, 0xeab9b9, 0xf5d4cf, 0xe8c1b6, 0xf2cdc3];
  spots.forEach(([x, z], i) => {
    m4.makeRotationY((rng() - 0.5) * 0.12);
    m4.setPosition(x, 0.05 + rng() * 0.015, z);
    im.setMatrixAt(i, m4);
    im.setColorAt(i, col.setHex(shades[Math.floor(rng() * shades.length)]));
  });
  im.castShadow = true; im.receiveShadow = true;
  g.add(im);
}

/* ---------- building shell ---------- */
const BW = 6.2;
{
  const g = piece(0.14, 0, -1.5);
  box(g, BW, 5.6, 3.0, P.mortar, 0, 6.1, -1.5, 0.06);           /* upper storeys */
  box(g, BW, 3.3, 1.6, P.interior, 0, 1.65, -2.2, 0.04);        /* back of the shop */
  box(g, 3.6, 0.06, 1.4, P.creamWarm, -0.9, 0.03, -0.7, 0.02);  /* shop floor */
  box(g, 0.4, 3.3, 1.4, P.cream, -2.9, 1.65, -0.7, 0.03);
  box(g, 0.4, 3.3, 1.4, P.cream, 1.1, 1.65, -0.7, 0.03);
  box(g, 0.8, 3.3, 1.4, P.mortar, 2.7, 1.65, -0.7, 0.03);
  box(g, 0.8, 2.95, 0.05, P.roseDark, 1.8, 1.48, -1.36, 0.01);  /* hallway behind the door */
  box(g, 0.8, 0.06, 1.3, P.roseDeep, 1.8, 0.03, -0.7, 0.02);
  /* parapet cornice and chimney */
  box(g, 6.55, 0.24, 3.3, P.cream, 0, 9.02, -1.5, 0.06);
  box(g, 6.35, 0.1, 3.15, P.creamWarm, 0, 8.86, -1.45, 0.03);
  box(g, 1.0, 1.1, 0.65, P.brickB, -2.1, 9.68, -2.1, 0.05);
  box(g, 1.1, 0.12, 0.75, P.cream, -2.1, 10.27, -2.1, 0.04);
  box(g, 0.22, 0.38, 0.22, P.peach, -2.35, 10.52, -2.1, 0.06);
  box(g, 0.22, 0.3, 0.22, P.roseLight, -1.85, 10.48, -2.1, 0.06);
  /* string course between the upper floors */
  box(g, BW + 0.1, 0.1, 0.14, P.cream, 0, 6.8, 0.06, 0.03);
}

/* ---------- brick facade ---------- */
const upperWins = [];
[-2.0, 0, 2.0].forEach(x => upperWins.push({ x, y0: 4.72, h: 1.62, w: 0.95, six: true }));
[-2.0, 0, 2.0].forEach(x => upperWins.push({ x, y0: 7.18, h: 1.02, w: 0.95, six: false }));
{
  const g = piece(0.28, 0, 0);
  const spots = [];
  let r = 0;
  for (let y = 4.3; y < 8.76; y += 0.2, r++) {
    if (Math.abs(y - 6.8) < 0.14) continue;
    for (let x = -2.88 + (r % 2 ? 0.23 : 0); x < 2.9; x += 0.46) {
      const hitWin = upperWins.some(w => Math.abs(x - w.x) < w.w / 2 + 0.33 && y > w.y0 - 0.22 && y < w.y0 + w.h + 0.38);
      if (!hitWin) spots.push([x, y]);
    }
  }
  const im = new THREE.InstancedMesh(rb(0.42, 0.16, 0.07, 0.025), mat(0xffffff, { roughness: 0.9 }), spots.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  const shades = [P.brickA, P.brickB, P.brickC, P.peach];
  spots.forEach(([x, y], i) => {
    m4.makeTranslation(x, y, 0.025);
    im.setMatrixAt(i, m4);
    im.setColorAt(i, col.setHex(shades[Math.floor(rng() * shades.length)]));
  });
  im.castShadow = true; im.receiveShadow = true;
  g.add(im);
}

/* ---------- sash windows ---------- */
const glassUp = mat(0xe3d0de, { roughness: 0.12, metalness: 0.1 });
upperWins.forEach((w, i) => {
  const g = piece(0.34 + i * 0.035, w.x, 0);
  const cy = w.y0 + w.h / 2, t = 0.08;
  box(g, w.w, w.h, 0.04, glassUp, w.x, cy, 0.0, 0.01);
  box(g, w.w + 2 * t, t, 0.07, P.cream, w.x, w.y0 + w.h + t / 2, 0.05, 0.02);
  box(g, w.w + 2 * t, t, 0.07, P.cream, w.x, w.y0 - t / 2, 0.05, 0.02);
  box(g, t, w.h, 0.07, P.cream, w.x - w.w / 2 - t / 2, cy, 0.05, 0.02);
  box(g, t, w.h, 0.07, P.cream, w.x + w.w / 2 + t / 2, cy, 0.05, 0.02);
  /* black glazing bars */
  [-w.w / 6, w.w / 6].forEach(dx => box(g, 0.03, w.h, 0.05, lineMat, w.x + dx, cy, 0.04, 0.01));
  box(g, w.w, 0.05, 0.06, lineMat, w.x, cy, 0.045, 0.01);
  if (w.six) [0.25, 0.75].forEach(f => box(g, w.w, 0.03, 0.05, lineMat, w.x, w.y0 + w.h * f, 0.04, 0.01));
  box(g, w.w + 0.32, 0.08, 0.26, P.cream, w.x, w.y0 - t - 0.04, 0.11, 0.03);
  box(g, w.w + 0.26, 0.2, 0.08, P.creamWarm, w.x, w.y0 + w.h + t + 0.1, 0.06, 0.03);
  box(g, 0.17, 0.3, 0.11, P.cream, w.x, w.y0 + w.h + t + 0.12, 0.08, 0.03);
});

/* ---------- shopfront: pilasters, stallriser, window ---------- */
{
  const g = piece(0.22, -0.9, 0.1);
  [-2.9, 2.55].forEach(x => {
    box(g, 0.48, 2.9, 0.22, P.cream, x, 1.45, 0.08, 0.04);
    box(g, 0.6, 0.3, 0.32, P.creamWarm, x, 0.15, 0.1, 0.04);
    box(g, 0.62, 0.16, 0.32, P.creamWarm, x, 2.84, 0.1, 0.04);
    [-0.12, 0, 0.12].forEach(dx => box(g, 0.05, 2.3, 0.04, P.creamWarm, x + dx, 1.5, 0.2, 0.02));
  });
  box(g, 0.42, 2.9, 0.16, P.cream, 1.1, 1.45, 0.06, 0.03);
  box(g, BW, 0.4, 0.2, P.cream, 0, 3.1, 0.06, 0.04);        /* frieze above window and door */
  box(g, 3.6, 0.62, 0.22, P.rose, -0.9, 0.31, 0.05, 0.04);  /* stallriser */
  [-2.1, -0.9, 0.3].forEach(x => box(g, 1.0, 0.36, 0.04, P.roseLight, x, 0.31, 0.17, 0.02));
  box(g, 3.7, 0.08, 0.3, P.cream, -0.9, 0.64, 0.1, 0.03);   /* sill */

  const glassMat = new THREE.MeshStandardMaterial({ color: 0xfbe6ec, roughness: 0.06, metalness: 0.1, transparent: true, opacity: 0.18, depthWrite: false });
  const glass = add(g, rb(3.6, 2.26, 0.02, 0.005), glassMat, -0.9, 1.77, 0.0, false);
  hideForAO.push(glass);

  /* black window frame */
  [2.88, 2.45, 0.68].forEach(y => box(g, 3.6, 0.05, 0.07, lineMat, -0.9, y, 0.03, 0.01));
  [-2.675, -1.5, -0.3, 0.875].forEach(x => box(g, 0.05, 2.24, 0.07, lineMat, x, 1.77, 0.03, 0.01));
  [-2.1, -0.9, 0.3].forEach(x => box(g, 0.035, 0.43, 0.06, lineMat, x, 2.665, 0.03, 0.01));

  /* pink vinyl: a band with a scalloped edge */
  const vinyl = mat(0xe995ab, { roughness: 0.5 });
  box(g, 3.5, 0.28, 0.012, vinyl, -0.9, 0.86, 0.025, 0.004, false);
  const disc = new THREE.CircleGeometry(0.12, 18);
  for (let x = -2.56; x <= 0.76; x += 0.24) add(g, disc, vinyl, x, 1.0, 0.026, false);
  [-2.1, -0.9, 0.3].forEach(x => add(g, new THREE.CircleGeometry(0.035, 12), vinyl, x, 2.665, 0.027, false));
}

/* ---------- fascia and sign ---------- */
const signCanvas = document.createElement('canvas');
signCanvas.width = 2048; signCanvas.height = 256;
const sctx = signCanvas.getContext('2d');
function drawSign() {
  sctx.clearRect(0, 0, 2048, 256);
  sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
  sctx.font = '600 156px "Jost", "Futura", "Avenir Next", system-ui, sans-serif';
  if ('letterSpacing' in sctx) sctx.letterSpacing = '10px';
  sctx.shadowColor = 'rgba(255, 236, 228, 0.9)'; sctx.shadowBlur = 14;
  sctx.fillStyle = '#fff7f0';
  sctx.fillText('itsgirlpowder', 1024, 132);
  sctx.shadowBlur = 0;
  sctx.fillText('itsgirlpowder', 1024, 132);
}
drawSign();
const signTex = new THREE.CanvasTexture(signCanvas);
signTex.colorSpace = THREE.SRGBColorSpace;
signTex.anisotropy = 8;
const signMat = new THREE.MeshStandardMaterial({ map: signTex, emissiveMap: signTex, emissive: 0xffffff, emissiveIntensity: 0.5, transparent: true, roughness: 0.6, depthWrite: false });
if (document.fonts && document.fonts.load) {
  document.fonts.load('600 156px "Jost"').then(() => { drawSign(); signTex.needsUpdate = true; }).catch(() => {});
}
{
  const g = piece(0.3, 0, 0.2);
  box(g, 5.6, 0.72, 0.36, P.rose, 0, 3.66, 0.18, 0.05);
  [3.33, 3.99].forEach(y => box(g, 5.6, 0.05, 0.05, P.cream, 0, y, 0.37, 0.02));
  [-3.0, 3.0].forEach(x => {
    box(g, 0.36, 0.86, 0.5, P.cream, x, 3.62, 0.22, 0.05);
    box(g, 0.24, 0.3, 0.06, P.creamWarm, x, 3.58, 0.48, 0.02);
  });
  box(g, 6.65, 0.14, 0.62, P.cream, 0, 4.1, 0.2, 0.05);
  box(g, 6.45, 0.08, 0.5, P.creamWarm, 0, 4.0, 0.18, 0.03);
  const sign = add(g, new THREE.PlaneGeometry(5.0, 0.625), signMat, 0, 3.66, 0.37, false);
  hideForAO.push(sign);
}

/* ---------- door ---------- */
let doorPivot;
{
  const g = piece(0.36, 1.8, 0.2);
  box(g, 0.1, 2.98, 0.2, P.cream, 1.35, 1.49, 0.04, 0.03);
  box(g, 0.1, 2.98, 0.2, P.cream, 2.25, 1.49, 0.04, 0.03);
  /* fanlight */
  const fan = new THREE.MeshStandardMaterial({ color: 0xfbe6ec, roughness: 0.06, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide });
  const fanMesh = add(g, new THREE.CircleGeometry(0.4, 28, 0, Math.PI), fan, 1.8, 2.52, 0.0, false);
  hideForAO.push(fanMesh);

const dummy = new THREE.Object3D();
function placeSpeck(dx, dy, dz) {
  const B = DISCO;
  const tx = dx > 0 ? (ROOM.x1 - B.x) / dx : dx < 0 ? (ROOM.x0 - B.x) / dx : Infinity;
  const ty = dy > 0 ? (ROOM.y1 - B.y) / dy : dy < 0 ? (ROOM.y0 - B.y) / dy : Infinity;
  const tz = dz > 0 ? (ROOM.zf - B.z) / dz : dz < 0 ? (ROOM.z0 - B.z) / dz : Infinity;
  const t = Math.min(tx, ty, tz);
  const x = B.x + dx * t, y = B.y + dy * t, z = B.z + dz * t;
  dummy.rotation.set(0, 0, 0);
  if (t === tz && dz > 0) {
    if (y < 0.7 || y > 2.86 || dy >= 0) return false;
    const t2 = (0.125 - B.y) / dy;
    const x2 = B.x + dx * t2, z2 = B.z + dz * t2;
    if (z2 < 0.2 || z2 > 3.7 || x2 < -5 || x2 > 3.1) return false;
    dummy.position.set(x2, 0.125, z2); dummy.rotation.x = -Math.PI / 2;
    return 1.5;
  }
  if (t === tz) { dummy.position.set(x, y, z + 0.012); return 1; }
  if (t === tx) { dummy.position.set(x + (dx > 0 ? -0.012 : 0.012), y, z); dummy.rotation.y = dx > 0 ? -Math.PI / 2 : Math.PI / 2; return 1; }
  dummy.position.set(x, y + (dy > 0 ? -0.012 : 0.012), z); dummy.rotation.x = dy > 0 ? Math.PI / 2 : -Math.PI / 2;
  return 1;
}

const flags = [];
function bunting(x0, x1, y, sag, z, n, d) {
  const g = piece(d, (x0 + x1) / 2, z);
  const xm = (x0 + x1) / 2, half = (x1 - x0) / 2;
  const yAt = x => y - sag * (1 - Math.pow((x - xm) / half, 2));
  const pts = [];
  for (let i = 0; i <= 24; i++) { const x = lerp(x0, x1, i / 24); pts.push(new THREE.Vector3(x, yAt(x), z)); }
  add(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.012, 5), mat(0xb98089), 0, 0, 0, false);
  const tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.Float32BufferAttribute([-0.13, 0, 0, 0.13, 0, 0, 0, -0.3, 0], 3));
  tri.computeVertexNormals();
  const cols = [P.rose, P.peach, P.cream, 0xf2b5c1];
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, (i + 0.5) / n);
    const pivot = new THREE.Group();
    pivot.position.set(x, yAt(x) - 0.01, z);
    g.add(pivot);
    const f = add(pivot, tri, mat(cols[i % cols.length], { side: THREE.DoubleSide, roughness: 0.7 }), 0, 0, 0);
    flags.push({ p: pivot, ph: i * 0.7 + z });
    void f;
  }
}

    add(p, new THREE.SphereGeometry(0.055, 10, 8), mat(c.skin), 0, -0.55, 0);
    return p;
  });
  add(g, new THREE.SphereGeometry(0.155, 18, 14), mat(c.skin, { roughness: 0.7 }), 0, 1.6, 0);
  const cap = add(g, new THREE.SphereGeometry(0.168, 18, 12, 0, TAU, 0, Math.PI * 0.55), mat(c.hair, { roughness: 0.7 }), 0, 1.615, -0.01);
  cap.rotation.x = -0.35;
  if (c.long) box(g, 0.3, 0.42, 0.1, c.hair, 0, 1.43, -0.13, 0.05);
  const bag = new THREE.Group();
  bag.position.set(0, -0.62, 0.02);
  box(bag, 0.24, 0.27, 0.1, 0xe58fa2, 0, -0.1, 0, 0.03);
  add(bag, new THREE.TorusGeometry(0.07, 0.012, 6, 16, Math.PI), mat(P.cream), 0, 0.03, 0);
  bag.visible = false;
  arms[1].add(bag);
  world.add(g);
  return { g, legs, arms, bag };
}
const outfits = [
  { top: P.cream, bottom: 0x6c4f5b, skin: 0xf2cfb7, hair: 0x3b2a2a, long: true },
  { top: 0xe8a1b0, bottom: 0xf5e6d8, skin: 0xb47a5c, hair: 0x2b2024, long: false },
  { top: P.peach, bottom: 0x8b6170, skin: 0xeec2a6, hair: 0xe0bf88, long: true },
  { top: 0xfbe2e6, bottom: 0xc98b95, skin: 0x7e5140, hair: 0x2b2024, long: true },
  { top: P.rose, bottom: 0xf3dccd, skin: 0xd9a487, hair: 0x7a4b32, long: false },
  { top: P.creamWarm, bottom: 0x5c4650, skin: 0xc68e6f, hair: 0xa0522d, long: true },
  { top: 0xf2b5c1, bottom: 0x6c4f5b, skin: 0xf3d0b8, hair: 0x5a3a2b, long: true },
  { top: P.cream, bottom: 0xd9a1a9, skin: 0x8d5a44, hair: 0x2b2024, long: false }
];
const tops = [P.cream, 0xe8a1b0, P.peach, 0xfbe2e6, P.rose, P.creamWarm, 0xf2b5c1, 0xf7d7c4];
const bottoms = [0x6c4f5b, 0xf5e6d8, 0x8b6170, 0xc98b95, 0xf3dccd, 0x5c4650, 0xd9a1a9];
const skins = [0xf2cfb7, 0xb47a5c, 0xeec2a6, 0x7e5140, 0xd9a487, 0xc68e6f, 0x8d5a44, 0xf3d0b8];
const hairs = [0x3b2a2a, 0x2b2024, 0xe0bf88, 0x7a4b32, 0xa0522d, 0x5a3a2b, 0x2b2024];
for (let i = outfits.length; i < 16; i++) outfits.push({ top: tops[(i * 3) % tops.length], bottom: bottoms[(i * 5) % bottoms.length], skin: skins[(i * 7) % skins.length], hair: hairs[(i * 2) % hairs.length], long: i % 3 !== 1 });
const queue = Array.from({ length: 12 }, (_, i) => ({ ...makePerson(outfits[i]), off: i / 12 }));
const leavers = [12, 13, 14, 15].map((k, i) => { const p = makePerson(outfits[k]); p.bag.visible = true; return { ...p, off: 0.09 + i * 0.25 }; });

const Q0 = [-3.9, 1.6], Q1 = [1.0, 1.6], STEP = [1.8, 0.78], IN = [1.8, -0.75], ARR = [-5.4, 2.7];
const OUT1 = [2.35, 2.75], OUT2 = [5.4, 3.35];
function walkPose(p, w, amt) {
  const s = Math.sin(w) * amt;
  p.legs[0].rotation.x = s * 0.5; p.legs[1].rotation.x = -s * 0.5;
  p.arms[0].rotation.x = -s * 0.4; p.arms[1].rotation.x = s * 0.4;
}
function queueState(u) {
  let x, z, s = 1, dx = 1, dz = 0, moving = 1, step = 0;
  if (u < 0.05) {
    const k = u / 0.05;
    x = lerp(ARR[0], Q0[0], k); z = lerp(ARR[1], Q0[1], k); dx = Q0[0] - ARR[0]; dz = Q0[1] - ARR[1];
    s = sstep(0, 0.018, u);
  } else if (u < 0.37) {
    const q = (u - 0.05) / 0.32, n = 5, sv = q * n, i = Math.floor(sv), f = sv - i;
    const ease = sstep(0.55, 1, f);
    x = lerp(Q0[0], Q1[0], (i + ease) / n); z = Q0[1];
    moving = f > 0.55 ? 1 : 0;
  } else if (u < 0.42) {
    const k = (u - 0.37) / 0.05;
    x = lerp(Q1[0], STEP[0], k); z = lerp(Q1[1], STEP[1], k); dx = STEP[0] - Q1[0]; dz = STEP[1] - Q1[1];
  } else if (u < 0.465) {
    const k = (u - 0.42) / 0.045;
    x = lerp(STEP[0], IN[0], k); z = lerp(STEP[1], IN[1], k); dx = 0; dz = -1;
    s = 1 - sstep(0.4425, 0.465, u);
  } else { x = IN[0]; z = IN[1]; s = 0; moving = 0; }
  if (z < 0.55 && z > 0.0 && x > 1.2 && x < 2.4) step = 0.16;
  return { x, z, s, yaw: Math.atan2(dx, dz), moving, step };
}
function leaveState(u) {
  let x, z, s = 1, dx = 0, dz = 1, step = 0;
  if (u < 0.035) {
    const k = u / 0.035;
    x = lerp(IN[0], STEP[0], k); z = lerp(IN[1], STEP[1], k);
    s = sstep(0, 0.018, u);
  } else if (u < 0.09) {
    const k = (u - 0.035) / 0.055;
    x = lerp(STEP[0], OUT1[0], k); z = lerp(STEP[1], OUT1[1], k); dx = OUT1[0] - STEP[0]; dz = OUT1[1] - STEP[1];
  } else if (u < 0.22) {
    const k = (u - 0.09) / 0.13;
    x = lerp(OUT1[0], OUT2[0], k); z = lerp(OUT1[1], OUT2[1], k); dx = OUT2[0] - OUT1[0]; dz = OUT2[1] - OUT1[1];
    s = 1 - sstep(0.205, 0.22, u);
  } else { x = OUT2[0]; z = OUT2[1]; s = 0; }
  if (z < 0.55 && z > 0.0 && x > 1.2 && x < 2.4) step = 0.16;
  return { x, z, s, yaw: Math.atan2(dx, dz), moving: s > 0 ? 1 : 0, step };
}
const win = (u, a, b) => sstep(a, a + 0.03, u) * (1 - sstep(b - 0.03, b, u));

/* ---------- photographer with flash ---------- */
let photographer, flashBulb, flashLight;
{
  const g = piece(0.52, 3.75, 2.45);
  const p = makePerson({ top: 0x4e3a43, bottom: 0x3d2f35, skin: 0xe9bfa2, hair: 0x2b2024, long: false });
  world.remove(p.g); g.add(p.g);
  p.g.position.set(3.75, 0, 2.45);
  p.g.rotation.y = Math.atan2(1.8 - 3.75, 0.6 - 2.45);
  p.arms.forEach(a => { a.rotation.x = -1.25; a.rotation.z = 0; });
  p.arms[0].rotation.z = -0.35; p.arms[1].rotation.z = 0.35;
  box(p.g, 0.26, 0.17, 0.15, P.charcoal, 0, 1.47, 0.32, 0.03);
  const lens = add(p.g, new THREE.CylinderGeometry(0.06, 0.07, 0.14, 14), mat(P.charcoal), 0, 1.47, 0.45);
  lens.rotation.x = Math.PI / 2;
  box(p.g, 0.14, 0.09, 0.1, P.cream, 0.04, 1.61, 0.3, 0.02);
  flashBulb = add(p.g, new THREE.SphereGeometry(0.06, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), 0.04, 1.61, 0.37, false);
  flashLight = new THREE.PointLight(0xfff8f2, 0, 9, 1.3);
  flashLight.position.set(0.04, 1.65, 0.6);
  p.g.add(flashLight);
  photographer = p;
}
const FLASHES = [2.3, 4.55, 6.85, 8.6, 11.4, 13.5, 15.8, 17.6];

/* ---------- confetti burst from above the door ---------- */
const CN = 220, CONF_T = 10.0;
const confetti = new THREE.InstancedMesh(rb(0.2, 0.014, 0.13, 0.005), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.2, side: THREE.DoubleSide }), CN);
confetti.frustumCulled = false;
world.add(confetti);
const confSeeds = [];
{
  const cc = new THREE.Color(), cols = [P.rose, P.peach, P.cream, 0xf2b5c1, P.silver, 0xe58fa2];
  for (let i = 0; i < CN; i++) {
    const a = rng() * TAU, sp = 1.6 + rng() * 2.4;
    confSeeds.push({ vx: Math.cos(a) * sp * 0.8, vz: Math.abs(Math.sin(a)) * sp * 0.9 + 0.4, vy: 3.8 + rng() * 3.2, rx: rng() * 9, ry: rng() * 9, ph: rng() * TAU, x0: lerp(-2.4, 2.6, rng()) });
    confetti.setColorAt(i, cc.setHex(cols[i % cols.length]));
  }
}

/* ---------- post-processing ---------- */
const rt = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 16, 16);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.blendIntensity = 0.95;
gtao.updateGtaoMaterial({ radius: 0.55, distanceExponent: 1.4, thickness: 1.2, scale: 1.1, samples: 16, distanceFallOff: 1 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
const gtaoRender = gtao.render.bind(gtao);
gtao.render = (...a) => {
  const prev = hideForAO.map(o => o.visible);
  hideForAO.forEach(o => { o.visible = false; });
  gtaoRender(...a);
  hideForAO.forEach((o, i) => { o.visible = prev[i]; });
};
composer.addPass(gtao);
composer.addPass(new OutputPass());

function resize() {
  const w = stage.clientWidth || 360, h = stage.clientHeight || 640;
  const pr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2.2e6 / (w * h)));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('stagefit', resize);
window.addEventListener('resize', resize);
resize();

/* ---------- the loop ---------- */
const target = new THREE.Vector3(0, 2.2, 0.6);
function update(t) {
  const u = t / T, v = t / 10;
  const alive = sstep(1.0, 1.35, t) * (1 - sstep(T - 0.8, T - 0.55, t));

  world.position.y = Math.sin(TAU * u) * 0.12;

  for (const pc of pieces) {
    const [s, dy] = buildFactor(t, pc.d);
    pc.s = s;
    pc.g.scale.setScalar(Math.max(1e-4, s));
    pc.g.position.y = dy;
    pc.g.visible = s > 0.002;
  }

  /* disco ball and speckles */
  const spin = TAU * v * 2;
  disco.rotation.y = spin;
  const sAlive = clamp01(interiorPiece.s) * sstep(0.9, 1.2, t);
  for (let i = 0; i < SPN; i++) {
    const sd = speckSeeds[i];
    const az = sd.a + spin, ce = Math.cos(sd.el);
    const k = placeSpeck(Math.sin(az) * ce, Math.sin(sd.el), Math.cos(az) * ce);
    const tw = 0.65 + 0.35 * Math.sin(TAU * (v * 6 + sd.tw));
    dummy.scale.setScalar(k ? sd.sz * k * tw * sAlive + 1e-5 : 1e-5);
    if (!k) dummy.position.set(0, -50, 0);
    dummy.updateMatrix();
    speck.setMatrixAt(i, dummy.matrix);
  }
  speck.instanceMatrix.needsUpdate = true;

  /* signs */
  const out = 1 - sstep(T - 0.7, T - 0.4, t);
  signMat.emissiveIntensity = 0.38 + 0.32 * (0.5 - 0.5 * Math.cos(TAU * v * 2));
  const neonOn = t < 0.75 ? 0 : t < 1.1 ? (frac(t * 11) < 0.55 ? 1 : 0.12) : 1;
  const nI = neonOn * (2.3 + 0.5 * Math.sin(TAU * v * 3)) * out;
  neonMat.emissiveIntensity = nI;
  neonLight.intensity = nI * 1.4;

  for (const il of islets) {
    const [s] = buildFactor(t, il.d);
    il.g.scale.setScalar(Math.max(1e-4, s * il.s));
    il.g.visible = s > 0.002;
    il.g.position.y = il.y + 0.25 * Math.sin(TAU * u * 2 + il.ph);
  }

  /* bunting, balloons, stars */
  for (const f of flags) f.p.rotation.x = 0.22 * Math.sin(TAU * v * 3 + f.ph);
  for (const b of balloons) {
    const bob = Math.sin(TAU * v * 2 + b.ph);
    b.b.position.set(b.rest.x + 0.07 * Math.sin(TAU * v + b.ph), b.rest.y + 0.1 * bob, b.rest.z + 0.05 * Math.cos(TAU * v + b.ph));
    b.b.rotation.z = 0.12 * Math.sin(TAU * v + b.ph);
    tmpV.copy(b.b.position).add(new THREE.Vector3(0, -0.33, 0)).sub(b.anchor);
    const len = tmpV.length();
    b.s.position.copy(b.anchor);
    b.s.scale.set(1, len, 1);
    b.s.quaternion.setFromUnitVectors(upV, tmpV.normalize());
  }
  for (const st of stars) {
    const [s] = buildFactor(t, st.d);
    const tw = 0.55 + 0.45 * Math.max(0, Math.sin(TAU * (v * st.k + st.ph)));
    st.m.scale.setScalar(Math.max(1e-4, s * st.s * tw));
    st.m.rotation.z = st.ph * TAU + st.dir * TAU * v;
    st.m.rotation.y = 0.6 + 0.3 * Math.sin(TAU * v + st.ph * 4);
    st.m.visible = s > 0.002;
  }

  /* guests */
  let door = 0;
  for (const p of queue) {
    const uu = frac(u + p.off);
    const st = queueState(uu);
    const s = st.s * alive;
    p.g.visible = s > 0.01;
    p.g.scale.setScalar(Math.max(1e-4, s));
    const w = TAU * uu * 80;
    p.g.position.set(st.x, st.step + (st.moving ? Math.abs(Math.sin(w)) * 0.035 : 0), st.z);
    p.g.rotation.y = st.yaw;
    walkPose(p, w, st.moving ? 0.9 : 0);
    if (!st.moving) p.arms[0].rotation.x = p.arms[1].rotation.x = 0.04 * Math.sin(TAU * v * 2 + p.off * 9);
    door = Math.max(door, win(uu, 0.4, 0.475));
  }
  for (const p of leavers) {
    const uu = frac(u + p.off);
    const st = leaveState(uu);
    const s = st.s * alive;
    p.g.visible = s > 0.01;
    p.g.scale.setScalar(Math.max(1e-4, s));
    const w = TAU * uu * 80;
    p.g.position.set(st.x, st.step + Math.abs(Math.sin(w)) * 0.035, st.z);
    p.g.rotation.y = st.yaw;
    walkPose(p, w, 0.9);
    door = Math.max(door, win(uu, 0.0, 0.05));
  }
  doorPivot.rotation.y = 1.35 * door * alive;

  /* confetti */
  {
    const k = t - CONF_T;
    for (let i = 0; i < CN; i++) {
      const c = confSeeds[i];
      if (k < 0 || k > 4.5) { dummy.position.set(0, -50, 0); dummy.scale.setScalar(1e-5); }
      else {
        const drag = 1 - Math.exp(-k * 1.6);
        const x = c.x0 + c.vx * drag / 1.6 + 0.12 * Math.sin(k * 3 + c.ph);
        const z = 0.6 + c.vz * drag / 1.6;
        const y = Math.max(0.12, 4.4 + c.vy * drag / 1.6 - 1.25 * k * k * 0.5 - 0.7 * k);
        dummy.position.set(x, y, z);
        dummy.rotation.set(c.rx + k * 6, c.ry + k * 4, k * 3);
        dummy.scale.setScalar(sstep(0, 0.08, k) * (1 - sstep(3.6, 4.5, k)) + 1e-5);
      }
      dummy.updateMatrix();
      confetti.setMatrixAt(i, dummy.matrix);
    }
    confetti.instanceMatrix.needsUpdate = true;
  }

  /* photographer flash */
  let flash = 0;
  for (const ft of FLASHES) { const k = t - ft; if (k >= 0 && k < 0.4) flash = Math.max(flash, Math.exp(-k * 16)); }
  flashBulb.scale.setScalar(0.2 + flash * 1.6);
  flashLight.intensity = flash * 60;
  hemi.intensity = 1.45 + flash * 0.35;
  photographer.g.position.y = 0.02 * Math.sin(TAU * v * 4);

  /* camera: eased swing with a gentle push-in, both periodic so the loop is seamless */
  const yaw = 0.58 + 0.22 * Math.sin(TAU * u);
  const push = 0.5 - 0.5 * Math.cos(TAU * u);
  const dist = 76 - 6 * push;
  const el = 0.5 + 0.035 * Math.sin(TAU * u + 1);
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(el) * dist, target.y + Math.sin(el) * dist, target.z + Math.cos(yaw) * Math.cos(el) * dist);
  camera.lookAt(target);

}

/* playback: autoplay; click or space pauses. #t4.5 in the URL freezes on that second. */
let t = 0, playing = true;
const m = /^#t(\d+(?:\.\d+)?)$/.exec(location.hash);
let reduce = false;
try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
if (m) { t = Math.min(T - 0.001, parseFloat(m[1])); playing = false; }
else if (reduce) { t = 5; playing = false; }
stage.addEventListener('click', () => { playing = !playing; });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing = !playing; } });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) t = (t + dt) % T;
  update(t);
  composer.render();
  window.__gpReady = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
